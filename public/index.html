<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Desenho Assinado</h1>
      <p>
        Entre com sua conta Google e escolha um número entre 1 e 100.
        Cada número gera uma figura diferente, assinada com seu e-mail verificado.
      </p>
    </header>

    <section aria-labelledby="login-titulo">
      <h2 id="login-titulo">1. Entre com o Google</h2>
      <div id="google-button"></div>
      <p id="status-login" role="status">Carregando login do Google...</p>
    </section>

    <form id="formulario" novalidate>
      <h2>2. Gere seu desenho</h2>

      <label for="numero">Número</label>
      <input
        id="numero"
        name="numero"
        type="number"
        min="1"
        max="100"
        step="1"
        required
        placeholder="42"
      >

      <button type="submit">Desenhar</button>
    </form>

    <p id="mensagem" role="alert"></p>

    <figure id="desenho" aria-live="polite"></figure>

    <button id="baixar" type="button" hidden>Baixar SVG</button>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
